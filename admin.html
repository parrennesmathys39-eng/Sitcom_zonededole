<title>Test Firestore Admin</title><style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #17231b;
}

.card {
    max-width: 650px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

#resultat {
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    word-break: break-word;
}

.vert {
    background: #d9f7e5;
    color: #087f3d;
}

.rouge {
    background: #ffdede;
    color: #c62828;
}

.jaune {
    background: #fff0c2;
    color: #795c00;
}

</style></head><body><div class="card"><h1>🔧 Test Firestore Admin</h1><p>
Vérification du compte et du rôle administrateur.
</p><div
    id="resultat"
    class="jaune"
>
⏳ Connexion à Firebase...
</div></div><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script><script>


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC85gp3FkHaVZPm7HdFP8jPlvATT-QH9_s",

    authDomain:
    "sictom-zone-de-dole-17296.firebaseapp.com",

    projectId:
    "sictom-zone-de-dole-17296",

    storageBucket:
    "sictom-zone-de-dole-17296.firebasestorage.app",

    messagingSenderId:
    "378183859073",

    appId:
    "1:378183859073:web:3b347f84a072fb0cb54680"

};


/* =========================
   INITIALISATION
========================= */

const resultat =
    document.getElementById(
        "resultat"
    );


try {

    firebase.initializeApp(
        firebaseConfig
    );

}
catch(error) {

    resultat.className =
        "rouge";

    resultat.innerHTML =

        "❌ ERREUR INITIALISATION FIREBASE" +

        "<br><br>" +

        "<strong>Code :</strong><br>" +

        (
            error.code ||
            "inconnu"
        ) +

        "<br><br>" +

        "<strong>Message :</strong><br>" +

        (
            error.message ||
            "inconnu"
        );

}


/* =========================
   AUTH + FIRESTORE
========================= */

const auth =
    firebase.auth();

const db =
    firebase.firestore();


auth.onAuthStateChanged(
async function(user) {

    if (!user) {

        resultat.className =
            "rouge";

        resultat.innerHTML =

            "❌ AUCUN COMPTE CONNECTÉ";

        return;

    }


    resultat.className =
        "jaune";

    resultat.innerHTML =

        "🟡 Compte connecté.<br><br>" +

        "Lecture du profil Firestore...";


    try {

        const profil =
            await db
                .collection("users")
                .doc(user.uid)
                .get();


        if (!profil.exists) {

            resultat.className =
                "rouge";

            resultat.innerHTML =

                "❌ AUTHENTIFICATION OK" +

                "<br><br>" +

                "Mais le document Firestore " +

                "<strong>users/" +

                user.uid +

                "</strong> n'existe pas." +

                "<br><br>" +

                "<strong>Email :</strong><br>" +

                (
                    user.email ||
                    "non renseigné"
                );

            return;

        }


        const donnees =
            profil.data();


        const role =
            donnees.role || "";


        resultat.className =
            "vert";


        resultat.innerHTML =

            "✅ FIREBASE + FIRESTORE OK" +

            "<br><br>" +

            "<strong>Email :</strong><br>" +

            (
                user.email ||
                "non renseigné"
            ) +

            "<br><br>" +

            "<strong>UID :</strong><br>" +

            user.uid +

            "<br><br>" +

            "<strong>Rôle :</strong><br>" +

            (
                role ||
                "aucun rôle"
            );


        if (role === "admin") {

            resultat.innerHTML +=

                "<br><br>" +

                "👑 <strong>ADMIN CONFIRMÉ</strong>";

        }

        else {

            resultat.innerHTML +=

                "<br><br>" +

                "⚠️ Le compte est connecté, " +

                "mais son rôle n'est pas « admin ».";

        }

    }

    catch(error) {

        console.error(
            "Erreur Firestore :",
            error
        );


        resultat.className =
            "rouge";


        resultat.innerHTML =

            "❌ AUTHENTIFICATION OK" +

            "<br><br>" +

            "Mais la lecture de Firestore est bloquée." +

            "<br><br>" +

            "<strong>Code :</strong><br>" +

            (
                error.code ||
                "inconnu"
            ) +

            "<br><br>" +

            "<strong>Message :</strong><br>" +

            (
                error.message ||
                "inconnu"
            );

    }

});

</script></body></html>
