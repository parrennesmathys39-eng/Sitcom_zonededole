<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Diagnostic administration — SICTOM Zone de Dole</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #17231b;
}

.container {
    max-width: 700px;
    margin: auto;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 16px;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
    color: #087f3d;
}

.etape {
    padding: 14px;
    margin-top: 10px;
    border-radius: 10px;
    background: #eee;
    word-break: break-word;
}

.ok {
    background: #d9f7e5;
    color: #087f3d;
}

.erreur {
    background: #ffdede;
    color: #c62828;
}

.attente {
    background: #fff0c2;
    color: #795c00;
}

.code {
    margin-top: 10px;
    padding: 12px;
    background: #17231b;
    color: white;
    border-radius: 8px;
    font-family: monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #087f3d;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

</style>

</head>


<body>


<div class="container">


<div class="card">

<h1>👑 Diagnostic administration</h1>

<p>
Cette page vérifie chaque étape de la connexion.
</p>

<div
    id="firebase"
    class="etape attente"
>
⏳ 1. Chargement de Firebase...
</div>

<div
    id="auth"
    class="etape attente"
>
⏳ 2. Vérification du compte...
</div>

<div
    id="profil"
    class="etape attente"
>
⏳ 3. Lecture du profil Firestore...
</div>

<div
    id="role"
    class="etape attente"
>
⏳ 4. Vérification du rôle...
</div>

<div
    id="resultat"
    class="etape attente"
>
⏳ Diagnostic en cours...
</div>

</div>


<div class="card">

<h2>🔎 Informations techniques</h2>

<div
    id="details"
    class="code"
>
Aucune information pour le moment.
</div>

</div>


<div class="card">

<button
    onclick="window.location.href='./agent.html'"
>
👷 Retour à l'espace agent
</button>

</div>


</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   CONFIGURATION FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyC85gp3FkHaVZPm7HdFP8jPlvATT-QH9_s",

    authDomain:
    "sictom-zone-de-dole-17296.firebaseapp.com",

    projectId:
    "sictom-zone-de-dole-17296",

    storageBucket:
    "sictom-zone-de-dole-17296.firebasestorage.app",

    messagingSenderId:
    "378183859073",

    appId:
    "1:378183859073:web:3b347f84a072fb0cb54680"

};


/* =====================================================
   ELEMENTS
===================================================== */

const firebaseBox =
    document.getElementById("firebase");

const authBox =
    document.getElementById("auth");

const profilBox =
    document.getElementById("profil");

const roleBox =
    document.getElementById("role");

const resultatBox =
    document.getElementById("resultat");

const detailsBox =
    document.getElementById("details");


/* =====================================================
   AFFICHAGE
===================================================== */

function ok(element, texte) {

    element.className =
        "etape ok";

    element.innerHTML =
        "✅ " + texte;

}


function erreur(element, texte) {

    element.className =
        "etape erreur";

    element.innerHTML =
        "❌ " + texte;

}


function attente(element, texte) {

    element.className =
        "etape attente";

    element.innerHTML =
        "⏳ " + texte;

}


function details(texte) {

    detailsBox.textContent =
        texte;

}


/* =====================================================
   INITIALISATION FIREBASE
===================================================== */

let auth = null;

let db = null;


try {

    firebase.initializeApp(
        firebaseConfig
    );

    auth =
        firebase.auth();

    db =
        firebase.firestore();


    ok(
        firebaseBox,
        "Firebase est correctement chargé."
    );


    details(
        "Projet Firebase : " +
        firebaseConfig.projectId
    );

}

catch(error) {

    erreur(
        firebaseBox,
        "Impossible d'initialiser Firebase."
    );


    details(
        "Code : " +
        (error.code || "inconnu") +

        "\n\nMessage : " +

        (error.message || "inconnu")
    );

}


/* =====================================================
   SI FIREBASE EST OK
===================================================== */

if (auth && db) {


    let compteVerifie = false;


    /*
     * Sécurité :
     * si Firebase ne répond jamais,
     * on affiche une erreur après 10 secondes.
     */

    const timeout =
        setTimeout(
            function() {

                if (!compteVerifie) {

                    erreur(
                        authBox,
                        "Firebase Auth ne renvoie aucune réponse après 10 secondes."
                    );


                    details(
                        "Cela indique généralement que la page ne récupère pas correctement la session Firebase."
                    );

                }

            },
            10000
        );


    /* =================================================
       AUTH
    ================================================= */

    auth.onAuthStateChanged(
        async function(user) {

            compteVerifie = true;

            clearTimeout(timeout);


            if (!user) {

                erreur(
                    authBox,
                    "Aucun utilisateur connecté."
                );


                attente(
                    profilBox,
                    "Impossible de lire users : aucun compte connecté."
                );


                attente(
                    roleBox,
                    "Impossible de vérifier le rôle."
                );


                erreur(
                    resultatBox,
                    "Tu n'es pas connecté à Firebase sur cette page."
                );


                details(
                    "Firebase fonctionne.\n\n" +

                    "Mais auth.currentUser = null.\n\n" +

                    "Connecte-toi dans agent.html puis ouvre admin.html sans fermer la session."
                );

                return;

            }


            /* =========================================
               UTILISATEUR TROUVE
            ========================================= */

            ok(
                authBox,
                "Compte Firebase détecté."
            );


            details(
                "UID : " +
                user.uid +

                "\n\nEmail : " +
                (user.email || "aucun") +

                "\n\nProvider : " +
                (
                    user.providerData &&
                    user.providerData[0]
                    ? user.providerData[0].providerId
                    : "inconnu"
                )
            );


            /* =========================================
               LECTURE PROFIL
            ========================================= */

            try {

                profilBox.innerHTML =
                    "⏳ Lecture de users/" +
                    user.uid +
                    "...";


                const profil =
                    await db
                    .collection("users")
                    .doc(user.uid)
                    .get();


                if (!profil.exists) {

                    erreur(
                        profilBox,
                        "Le document users/" +
                        user.uid +
                        " n'existe pas."
                    );


                    erreur(
                        roleBox,
                        "Impossible de vérifier le rôle."
                    );


                    erreur(
                        resultatBox,
                        "Profil Firestore introuvable."
                    );


                    details(
                        detailsBox.textContent +

                        "\n\nFirestore :\n" +

                        "Document users/" +
                        user.uid +

                        "\n\nExiste : NON"
                    );

                    return;

                }


                ok(
                    profilBox,
                    "Profil Firestore trouvé."
                );


                const data =
                    profil.data();


                const role =
                    data.role || "";


                const prenom =
                    data.prenom || "";


                const nom =
                    data.nom || "";


                details(
                    detailsBox.textContent +

                    "\n\nFirestore :\n" +

                    "Document : users/" +
                    user.uid +

                    "\n\nExiste : OUI" +

                    "\n\nPrénom : " +
                    prenom +

                    "\nNom : " +
                    nom +

                    "\nRôle : " +
                    (role || "aucun")
                );


                /* =====================================
                   ROLE
                ===================================== */

                if (role === "admin") {

                    ok(
                        roleBox,
                        "Rôle admin confirmé."
                    );


                    ok(
                        resultatBox,
                        "🎉 Tout fonctionne. Ce compte est administrateur."
                    );


                    details(
                        detailsBox.textContent +

                        "\n\nRESULTAT :\n" +

                        "Accès administration autorisé."
                    );

                }

                else {

                    erreur(
                        roleBox,
                        "Le compte n'est pas administrateur."
                    );


                    erreur(
                        resultatBox,
                        "Accès refusé."
                    );


                    details(
                        detailsBox.textContent +

                        "\n\nRESULTAT :\n" +

                        "Le champ role doit être exactement : admin"
                    );

                }

            }

            catch(error) {

                erreur(
                    profilBox,
                    "Erreur lors de la lecture de Firestore."
                );


                erreur(
                    roleBox,
                    "Vérification du rôle impossible."
                );


                erreur(
                    resultatBox,
                    "Firestore bloque la lecture du profil."
                );


                details(
                    detailsBox.textContent +

                    "\n\nERREUR FIRESTORE :\n" +

                    "Code : " +
                    (error.code || "inconnu") +

                    "\n\nMessage : " +
                    (error.message || "inconnu")
                );

            }

        }
    );

}

</script>


</body>

</html>
