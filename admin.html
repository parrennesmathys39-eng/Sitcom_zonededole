<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Test Administration — SICTOM</title><style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #17231b;
}

h1 {
    color: #087f3d;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
    margin-bottom: 15px;
}

.ok {
    background: #d9f7e5;
    color: #087f3d;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
}

.erreur {
    background: #ffdede;
    color: #c62828;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    word-break: break-word;
}

.info {
    background: #fff8df;
    color: #795c00;
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
    word-break: break-word;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #087f3d;
    color: white;
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
}

</style></head><body><h1>👑 Test Administration</h1><div class="card"><strong>État du système :</strong>

<div
    id="etat"
    class="info"
>
⏳ Chargement de Firebase...
</div></div><div class="card"><strong>Informations :</strong>

<div id="infos">En attente...

</div></div><button
id="deconnexion"

«»

🚪 Déconnexion
</button>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script><script>


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC85gp3FkHaVZPm7HdFP8jPlvATT-QH9_s",

    authDomain:
    "sictom-zone-de-dole-17296.firebaseapp.com",

    projectId:
    "sictom-zone-de-dole-17296",

    storageBucket:
    "sictom-zone-de-dole-17296.firebasestorage.app",

    messagingSenderId:
    "378183859073",

    appId:
    "1:378183859073:web:3b347f84a072fb0cb54680"

};


/* =========================
   INITIALISATION
========================= */

try {

    firebase.initializeApp(
        firebaseConfig
    );

}
catch(error) {

    document.getElementById(
        "etat"
    ).className =
        "erreur";

    document.getElementById(
        "etat"
    ).innerHTML =
        "❌ Firebase ne démarre pas.<br><br>" +
        error.message;

}


/* =========================
   SERVICES
========================= */

const auth =
    firebase.auth();

const db =
    firebase.firestore();


/* =========================
   ELEMENTS
========================= */

const etat =
    document.getElementById(
        "etat"
    );

const infos =
    document.getElementById(
        "infos"
    );


/* =========================
   AUTHENTIFICATION
========================= */

auth.onAuthStateChanged(
    async function(user) {

        /*
         * Aucun utilisateur
         */

        if (!user) {

            etat.className =
                "erreur";

            etat.innerHTML =
                "❌ Aucun compte connecté.";

            infos.innerHTML =
                "Tu dois être connecté avec ton compte agent/admin.";

            return;

        }


        /*
         * Compte trouvé
         */

        etat.className =
            "ok";

        etat.innerHTML =
            "🟢 COMPTE FIREBASE TROUVÉ";


        infos.innerHTML =

            "<strong>Email :</strong><br>" +

            (
                user.email ||
                "Non disponible"
            ) +

            "<br><br>" +

            "<strong>UID :</strong><br>" +

            user.uid +

            "<br><br>" +

            "⏳ Lecture du document users...";


        /*
         * Lecture Firestore
         */

        try {

            const profil =
                await db
                    .collection("users")
                    .doc(user.uid)
                    .get();


            /*
             * Document absent
             */

            if (!profil.exists) {

                etat.className =
                    "erreur";

                etat.innerHTML =
                    "❌ COMPTE TROUVÉ MAIS PROFIL ABSENT";

                infos.innerHTML =

                    "Le compte Firebase fonctionne.<br><br>" +

                    "Mais Firestore ne trouve pas :<br><br>" +

                    "<strong>users/" +
                    user.uid +
                    "</strong>";

                return;

            }


            /*
             * Profil trouvé
             */

            const data =
                profil.data();


            const role =
                data.role ||
                "aucun";


            etat.className =
                "ok";

            etat.innerHTML =
                "🟢 FIREBASE + FIRESTORE FONCTIONNENT";


            infos.innerHTML =

                "<strong>Email :</strong><br>" +

                (
                    user.email ||
                    "Non disponible"
                ) +

                "<br><br>" +

                "<strong>UID :</strong><br>" +

                user.uid +

                "<br><br>" +

                "<strong>Rôle :</strong><br>" +

                role +

                "<br><br>" +

                "<strong>Prénom :</strong><br>" +

                (
                    data.prenom ||
                    "Non renseigné"
                ) +

                "<br><br>" +

                "<strong>Nom :</strong><br>" +

                (
                    data.nom ||
                    "Non renseigné"
                );


            /*
             * Vérification admin
             */

            if (role === "admin") {

                etat.innerHTML =
                    "🟢🟢 ADMIN CONFIRMÉ";

            }

            else {

                etat.className =
                    "info";

                etat.innerHTML =
                    "🟠 COMPTE CONNECTÉ MAIS PAS ADMIN";

            }

        }

        catch(error) {

            console.error(
                error
            );


            etat.className =
                "erreur";

            etat.innerHTML =
                "❌ ERREUR FIRESTORE";


            infos.innerHTML =

                "<strong>Code :</strong><br>" +

                (
                    error.code ||
                    "inconnu"
                ) +

                "<br><br>" +

                "<strong>Message :</strong><br>" +

                (
                    error.message ||
                    "inconnu"
                );

        }

    }
);


/* =========================
   DECONNEXION
========================= */

document
    .getElementById(
        "deconnexion"
    )
    .addEventListener(
        "click",
        async function() {

            await auth.signOut();

        }
    );

</script></body></html>
