<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Administration — SICTOM Zone de Dole</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #17231b;
}

header {
    background: linear-gradient(
        135deg,
        #087f3d,
        #18a558
    );
    color: white;
    padding: 25px 18px;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 8px 0 0;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 18px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 17px;
    margin-bottom: 18px;
    box-shadow:
        0 4px 18px rgba(0,0,0,.08);
}

.success {
    background: #d9f7e5;
    color: #087f3d;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
}

.error {
    background: #ffdede;
    color: #c62828;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
}

.info {
    background: #eef4ff;
    color: #2455a4;
    padding: 15px;
    border-radius: 12px;
}

.site {
    border-top: 1px solid #eee;
    padding: 18px 0;
}

.site:first-child {
    border-top: none;
}

.site-title {
    font-size: 20px;
    font-weight: bold;
}

.site-id {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
}

.flux {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-top: 1px solid #eee;
}

.flux:first-child {
    margin-top: 12px;
}

.flux-name {
    font-weight: bold;
}

.badge {
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

.green {
    background: #d9f7e5;
    color: #087f3d;
}

.orange {
    background: #fff0c2;
    color: #946200;
}

.red {
    background: #ffdede;
    color: #c62828;
}

.grey {
    background: #eeeeee;
    color: #666;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.stat {
    text-align: center;
    background: #f7f9f7;
    padding: 15px;
    border-radius: 13px;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
}

.stat-label {
    color: #777;
    font-size: 13px;
}

button,
a {
    display: inline-block;
    border: none;
    padding: 13px 16px;
    border-radius: 10px;
    background: #17231b;
    color: white;
    text-decoration: none;
    font-weight: bold;
    margin-right: 8px;
    margin-top: 8px;
}

.green-button {
    background: #087f3d;
}

@media (max-width: 600px) {

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .flux {
        align-items: flex-start;
    }

    .badge {
        font-size: 11px;
    }

}

</style>

</head>


<body>


<header>

<h1>👑 Administration</h1>

<p>SICTOM Zone de Dole</p>

</header>


<div class="container">


<!-- CONNEXION -->

<div class="card">

<h2>🔐 Connexion</h2>

<div id="connexion">
🔄 Vérification...
</div>

</div>


<!-- STATISTIQUES -->

<div
    id="statsCard"
    class="card"
    style="display:none;"
>

<h2>📊 Données Firestore</h2>

<div class="stats">

<div class="stat">

<div
    id="totalSites"
    class="stat-number"
>
0
</div>

<div class="stat-label">
Déchèteries
</div>

</div>

<div class="stat">

<div
    id="totalFlux"
    class="stat-number"
>
0
</div>

<div class="stat-label">
Flux
</div>

</div>

<div class="stat">

<div
    id="totalPleins"
    class="stat-number"
>
0
</div>

<div class="stat-label">
Pleins
</div>

</div>

</div>

</div>


<!-- DONNEES -->

<div
    id="dataCard"
    class="card"
    style="display:none;"
>

<h2>♻️ Données enregistrées</h2>

<div id="data">

</div>

</div>


<div class="card">

<a
    class="green-button"
    href="./agent.html"
>
👷 Retour agent
</a>

<a
    href="./index.html"
>
🏠 Accueil
</a>

</div>


</div>


<!-- FIREBASE -->

<script
src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js">
</script>

<script
src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js">
</script>

<script
src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js">
</script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC85gp3FkHaVZPm7HdFP8jPlvATT-QH9_s",

    authDomain:
    "sictom-zone-de-dole-17296.firebaseapp.com",

    projectId:
    "sictom-zone-de-dole-17296",

    storageBucket:
    "sictom-zone-de-dole-17296.firebasestorage.app",

    messagingSenderId:
    "378183859073",

    appId:
    "1:378183859073:web:3b347f84a072fb0cb54680"

};


firebase.initializeApp(
    firebaseConfig
);


const auth =
firebase.auth();


const db =
firebase.firestore();


const connexion =
document.getElementById(
    "connexion"
);


const data =
document.getElementById(
    "data"
);


/* =========================
   STATUT
========================= */

function statutHTML(statut) {

    if (
        statut === "disponible"
    ) {

        return `
            <span class="badge green">
                🟢 Disponible
            </span>
        `;

    }


    if (
        statut === "presque"
    ) {

        return `
            <span class="badge orange">
                🟠 Presque pleine
            </span>
        `;

    }


    if (
        statut === "pleine"
    ) {

        return `
            <span class="badge red">
                🔴 Pleine
            </span>
        `;

    }


    return `
        <span class="badge grey">
            ℹ️ ${statut || "Inconnu"}
        </span>
    `;

}


/* =========================
   CHARGER DIRECTEMENT
   CHAUSSIN / BOIS-A
========================= */

async function testBoisA() {

    try {

        const doc =
            await db
            .collection("dechetteries")
            .doc("chaussin")
            .collection("flux")
            .doc("bois-a")
            .get();


        if (!doc.exists) {

            data.innerHTML += `

                <div class="error">

                    ❌ Le document
                    <strong>
                        dechetteries/chaussin/flux/bois-a
                    </strong>
                    n'existe pas.

                </div>

            `;

            return;

        }


        const flux =
            doc.data();


        const statut =
            flux.statut ||
            "inconnu";


        data.innerHTML += `

            <div class="site">

                <div class="site-title">
                    ♻️ Chaussin
                </div>

                <div class="site-id">
                    ID : chaussin
                </div>

                <div class="flux">

                    <span class="flux-name">
                        🪵 Bois A
                    </span>

                    ${statutHTML(statut)}

                </div>

                <div class="info">

                    <strong>
                        Chemin Firestore :
                    </strong>

                    <br><br>

                    dechetteries /
                    chaussin /
                    flux /
                    bois-a

                </div>

            </div>

        `;


        document.getElementById(
            "totalFlux"
        ).textContent = "1";


        document.getElementById(
            "totalSites"
        ).textContent = "1";


        document.getElementById(
            "totalPleins"
        ).textContent =
            statut === "pleine"
            ? "1"
            : "0";

    }
    catch(error) {

        data.innerHTML += `

            <div class="error">

                ❌ Erreur de lecture :

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
async function(user) {

    if (!user) {

        connexion.innerHTML = `

            <div class="error">

                ❌ Aucun compte connecté.

                <br><br>

                Connecte-toi d'abord
                dans agent.html.

            </div>

        `;

        return;

    }


    try {

        const profil =
            await db
            .collection("users")
            .doc(user.uid)
            .get();


        if (!profil.exists) {

            connexion.innerHTML = `

                <div class="error">

                    ❌ Aucun profil trouvé.

                </div>

            `;

            return;

        }


        const role =
            profil.data().role;


        if (
            role !== "admin"
        ) {

            connexion.innerHTML = `

                <div class="error">

                    ❌ Accès refusé.

                    <br><br>

                    Rôle détecté :
                    ${role || "aucun"}

                </div>

            `;

            return;

        }


        connexion.innerHTML = `

            <div class="success">

                👑 Administrateur confirmé

                <br><br>

                ${user.email || ""}

            </div>

        `;


        document.getElementById(
            "statsCard"
        ).style.display =
            "block";


        document.getElementById(
            "dataCard"
        ).style.display =
            "block";


        /*
         * TEST DIRECT DE LA DONNÉE
         */

        await testBoisA();


    }
    catch(error) {

        connexion.innerHTML = `

            <div class="error">

                ❌ Erreur Firebase :

                <br><br>

                ${error.message}

            </div>

        `;

    }

});

</script>


</body>

</html>
