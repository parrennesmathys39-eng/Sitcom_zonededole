<title>Test Admin Firebase</title><style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #17231b;
}

.card {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

#resultat {
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    background: #eee;
    word-break: break-word;
}

.vert {
    background: #d9f7e5 !important;
    color: #087f3d;
}

.rouge {
    background: #ffdede !important;
    color: #c62828;
}

.jaune {
    background: #fff0c2 !important;
    color: #795c00;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #087f3d;
    color: white;
    font-size: 16px;
    font-weight: bold;
    margin-top: 15px;
}

</style></head><body><div class="card"><h1>🔧 Test Firebase Admin</h1><p>
Cette page vérifie uniquement la connexion Firebase.
</p><div
    id="resultat"
    class="jaune"
>
⏳ Vérification de la connexion...
</div><button id="logout">
🚪 Se déconnecter
</button></div><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script><script>


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC85gp3FkHaVZPm7HdFP8jPlvATT-QH9_s",

    authDomain:
    "sictom-zone-de-dole-17296.firebaseapp.com",

    projectId:
    "sictom-zone-de-dole-17296",

    storageBucket:
    "sictom-zone-de-dole-17296.firebasestorage.app",

    messagingSenderId:
    "378183859073",

    appId:
    "1:378183859073:web:3b347f84a072fb0cb54680"

};


/* =========================
   INITIALISATION
========================= */

try {

    firebase.initializeApp(
        firebaseConfig
    );

}
catch(error) {

    document.getElementById(
        "resultat"
    ).className = "rouge";

    document.getElementById(
        "resultat"
    ).innerHTML =

        "❌ ERREUR INITIALISATION FIREBASE<br><br>" +

        "<strong>Code :</strong><br>" +

        (
            error.code ||
            "inconnu"
        ) +

        "<br><br>" +

        "<strong>Message :</strong><br>" +

        (
            error.message ||
            "inconnu"
        );

}


/* =========================
   AUTH
========================= */

try {

    const auth =
        firebase.auth();


    auth.onAuthStateChanged(
        function(user) {

            const resultat =
                document.getElementById(
                    "resultat"
                );


            if (user) {

                resultat.className =
                    "vert";


                resultat.innerHTML =

                    "✅ FIREBASE AUTHENTIFICATION OK" +

                    "<br><br>" +

                    "<strong>Email :</strong><br>" +

                    (
                        user.email ||
                        "non renseigné"
                    ) +

                    "<br><br>" +

                    "<strong>UID :</strong><br>" +

                    (
                        user.uid ||
                        "non renseigné"
                    );

            }

            else {

                resultat.className =
                    "rouge";


                resultat.innerHTML =

                    "❌ AUCUN COMPTE CONNECTÉ" +

                    "<br><br>" +

                    "Firebase fonctionne, mais aucun utilisateur n'est actuellement connecté.";

            }

        }
    );


    auth.onIdTokenChanged(
        function(user) {

            console.log(
                "onIdTokenChanged :",
                user
            );

        }
    );


    document
    .getElementById("logout")
    .addEventListener(
        "click",
        async function() {

            try {

                await auth.signOut();

                location.reload();

            }

            catch(error) {

                const resultat =
                    document.getElementById(
                        "resultat"
                    );


                resultat.className =
                    "rouge";


                resultat.innerHTML =

                    "❌ ERREUR DÉCONNEXION<br><br>" +

                    "<strong>Code :</strong><br>" +

                    (
                        error.code ||
                        "inconnu"
                    ) +

                    "<br><br>" +

                    "<strong>Message :</strong><br>" +

                    (
                        error.message ||
                        "inconnu"
                    );

            }

        }
    );

}
catch(error) {

    const resultat =
        document.getElementById(
            "resultat"
        );


    resultat.className =
        "rouge";


    resultat.innerHTML =

        "❌ ERREUR AUTHENTIFICATION<br><br>" +

        "<strong>Code :</strong><br>" +

        (
            error.code ||
            "inconnu"
        ) +

        "<br><br>" +

        "<strong>Message :</strong><br>" +

        (
            error.message ||
            "inconnu"
        );

}

</script></body></html>
