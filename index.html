<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sitcom Zone de Dole</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #17231b;
}

header {
    background: linear-gradient(135deg, #087f3d, #18a558);
    color: white;
    padding: 30px 20px 40px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 10px 0 0;
    opacity: 0.9;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.bouton-agent {
    display: block;
    text-align: center;
    margin: 15px 0;
    padding: 16px;
    background: #17231b;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 17px;
}

.bouton-agent:active {
    transform: scale(0.98);
}

.search {
    background: white;
    padding: 18px;
    border-radius: 16px;
    margin-top: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.search input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 17px;
    outline: none;
}

.search input:focus {
    border-color: #18a558;
}

h2 {
    margin-top: 30px;
}

#map {
    height: 430px;
    border-radius: 16px;
    margin-top: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    overflow: hidden;
}

.legend {
    background: white;
    padding: 15px;
    margin-top: 15px;
    border-radius: 12px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.legend span {
    display: flex;
    align-items: center;
    gap: 6px;
}

.dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    display: inline-block;
}

.green {
    background: #18a558;
}

.orange {
    background: #f0a500;
}

.red {
    background: #d62828;
}

.fiche {
    background: white;
    margin-top: 25px;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.fiche h3 {
    margin-top: 0;
    font-size: 23px;
}

.adresse {
    color: #666;
    margin-bottom: 20px;
}

.important {
    background: #e9f8ef;
    border-left: 4px solid #18a558;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 14px;
}

.compteurs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
}

.compteur {
    padding: 12px 6px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
}

.compteur-vert {
    background: #d9f7e5;
    color: #087f3d;
}

.compteur-orange {
    background: #fff0c2;
    color: #9a6500;
}

.compteur-rouge {
    background: #ffdede;
    color: #c62828;
}

.benne {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-top: 1px solid #eee;
    gap: 10px;
}

.benne-name {
    font-weight: 500;
}

.statut {
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.disponible {
    background: #d9f7e5;
    color: #087f3d;
}

.presque {
    background: #fff0c2;
    color: #9a6500;
}

.pleine {
    background: #ffdede;
    color: #c62828;
}

.mise-a-jour {
    margin-top: 18px;
    font-size: 13px;
    color: #777;
}

.info-live {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #e9f8ef;
    color: #087f3d;
    font-size: 13px;
}

.itineraire {
    display: inline-block;
    margin-top: 15px;
    padding: 13px 17px;
    border-radius: 10px;
    background: #087f3d;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.type-site {
    display: inline-block;
    padding: 6px 10px;
    background: #e7f5ec;
    color: #087f3d;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 12px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    font-size: 13px;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 25px;
    }

    #map {
        height: 350px;
    }

    .benne {
        font-size: 14px;
    }

    .statut {
        font-size: 12px;
    }

    .compteurs {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header>

<h1>♻️ Sitcom Zone de Dole</h1>

<p>
Vérifiez avant de vous déplacer.
</p>

</header>


<div class="container">


<a
    href="./agent.html"
    class="bouton-agent"
>
👷 Espace agent
</a>


<div class="search">

<input
    type="text"
    id="search"
    placeholder="🔎 Rechercher une déchetterie ou un déchet..."
>

</div>


<h2>
🗺️ Déchetteries autour de Dole
</h2>


<div id="map"></div>


<div class="legend">

<span>
<span class="dot green"></span>
Disponible
</span>

<span>
<span class="dot orange"></span>
Presque pleine
</span>

<span>
<span class="dot red"></span>
Pleine
</span>

</div>


<div id="fiche-container"></div>


</div>


<footer>

Sitcom Zone de Dole — Projet local ♻️

</footer>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getFirestore,
    collection,
    onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyC85gp3FkHaVZPm7HdFP8jPlvATT-QH9_s",

    authDomain:
    "sictom-zone-de-dole-17296.firebaseapp.com",

    projectId:
    "sictom-zone-de-dole-17296",

    storageBucket:
    "sictom-zone-de-dole-17296.firebasestorage.app",

    messagingSenderId:
    "378183859073",

    appId:
    "1:378183859073:web:3b347f84a072fb0cb54680"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);



/* ==================================================
   CARTE
================================================== */

const map =
L.map("map").setView(
    [47.09, 5.49],
    10
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
        "&copy; OpenStreetMap contributors"
    }
).addTo(map);



/* ==================================================
   FLUX
================================================== */

function creerFlux() {

    return [

        {
            id: "tout-venant",
            nom: "🗑️ Tout-venant",
            statut: "disponible"
        },

        {
            id: "carton",
            nom: "📦 Carton",
            statut: "disponible"
        },

        {
            id: "gravats",
            nom: "🪨 Gravats",
            statut: "disponible"
        },

        {
            id: "ferraille",
            nom: "🔩 Ferraille",
            statut: "disponible"
        },

        {
            id: "bois-a",
            nom: "🪵 Bois A",
            statut: "disponible"
        },

        {
            id: "bois-b",
            nom: "🪵 Bois B",
            statut: "disponible"
        },

        {
            id: "mobilier",
            nom: "🛋️ Mobilier",
            statut: "disponible"
        },

        {
            id: "platre",
            nom: "🧱 Plâtre",
            statut: "disponible"
        },

        {
            id: "plastique-dur",
            nom: "🧴 Plastique dur",
            statut: "disponible"
        }

    ];

}



/* ==================================================
   DECHETTERIES
================================================== */

const dechetteries = [

    {
        nom: "Dole",
        lat: 47.092,
        lng: 5.486,
        adresse: "Rue Costes et Bellonte",
        type: "Déchèterie",
        professionnels: false,
        flux: creerFlux()
    },

    {
        nom: "Brevans",
        lat: 47.087,
        lng: 5.455,
        adresse: "22 allée du bois",
        type: "Déchèterie",
        professionnels: true,
        flux: creerFlux()
    },

    {
        nom: "Tavaux",
        lat: 47.044,
        lng: 5.405,
        adresse: "10 Rue du Luxembourg",
        type: "Déchèterie",
        professionnels: true,
        flux: creerFlux()
    },

    {
        nom: "Chaussin",
        lat: 46.966,
        lng: 5.408,
        adresse: "Zone industrielle",
        type: "Déchèterie",
        professionnels: true,
        flux: creerFlux()
    },

    {
        nom: "Dampierre",
        lat: 47.151,
        lng: 5.675,
        adresse: "6 Chemin du Tissage",
        type: "Déchèterie",
        professionnels: true,
        flux: creerFlux()
    },

    {
        nom: "Mont-sous-Vaudrey",
        lat: 46.999,
        lng: 5.584,
        adresse: "18 Route de Dole",
        type: "Déchèterie",
        professionnels: true,
        flux: creerFlux()
    },

    {
        nom: "Montmirey-le-Château",
        lat: 47.217,
        lng: 5.609,
        adresse: "Le Charme",
        type: "Déchèterie",
        professionnels: true,
        flux: creerFlux()
    },

    {
        nom: "Saligney",
        lat: 47.208,
        lng: 5.653,
        adresse: "Rue Principale",
        type: "Déchèterie",
        professionnels: true,
        flux: creerFlux()
    },

    {
        nom: "Villers-Farlay",
        lat: 46.984,
        lng: 5.718,
        adresse: "Rue du Val d'Amour",
        type: "Déchèterie",
        professionnels: true,
        flux: creerFlux()
    },

    {
        nom: "Saint-Aubin",
        lat: 46.944,
        lng: 5.314,
        adresse: "Rue de Fragnot",
        type: "Végéterie",
        professionnels: false,

        flux: [

            {
                id: "vegetaux",
                nom: "🌿 Végétaux",
                statut: "disponible"
            }

        ]
    }

];



/* ==================================================
   OUTILS
================================================== */

function siteId(nom) {

    return nom
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-|-$/g,
            "");

}



/* ==================================================
   STATUT
================================================== */

function statutHTML(statut) {

    if (statut === "disponible") {

        return `
            <span class="statut disponible">
                🟢 Disponible
            </span>
        `;

    }

    if (statut === "presque") {

        return `
            <span class="statut presque">
                🟠 Presque pleine
            </span>
        `;

    }

    if (statut === "pleine") {

        return `
            <span class="statut pleine">
                🔴 Pleine
            </span>
        `;

    }

    return `
        <span class="statut">
            ℹ️ Information
        </span>
    `;

}



/* ==================================================
   DATE
================================================== */

function dateMiseAJour(date) {

    if (!date) {
        return "Aucune mise à jour";
    }

    try {

        const d = date.toDate();

        return d.toLocaleString(
            "fr-FR",
            {
                day: "2-digit",
                month: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }

    catch {

        return "Récemment";

    }

}



/* ==================================================
   FICHE
================================================== */

let siteActuel = null;


function afficherFiche(site) {

    siteActuel = site;

    const container =
        document.getElementById(
            "fiche-container"
        );


    let disponibles = 0;
    let presque = 0;
    let pleines = 0;


    site.flux.forEach(
        function(flux) {

            if (
                flux.statut ===
                "disponible"
            ) {
                disponibles++;
            }

            if (
                flux.statut ===
                "presque"
            ) {
                presque++;
            }

            if (
                flux.statut ===
                "pleine"
            ) {
                pleines++;
            }

        }
    );


    let html = `

        <div class="fiche">

            <span class="type-site">
                ${site.type}
            </span>

            <h3>
                ♻️ ${site.nom}
            </h3>

            <div class="adresse">
                📍 ${site.adresse}
            </div>


            <div class="compteurs">

                <div class="compteur compteur-vert">
                    🟢 ${disponibles}
                    disponible${disponibles > 1 ? "s" : ""}
                </div>

                <div class="compteur compteur-orange">
                    🟠 ${presque}
                    presque pleine${presque > 1 ? "s" : ""}
                </div>

                <div class="compteur compteur-rouge">
                    🔴 ${pleines}
                    pleine${pleines > 1 ? "s" : ""}
                </div>

            </div>

    `;


    if (
        site.nom ===
        "Chaussin"
    ) {

        html += `

            <div class="important">

                ⭐ <strong>
                    Flux importants à surveiller
                </strong>

                <br><br>

                🪵 Bois A / Bois B

                <br>

                🛋️ Mobilier

            </div>

        `;

    }


    html += `

        <h4>
            État des flux suivis
        </h4>

    `;


    site.flux.forEach(
        function(flux) {

            html += `

                <div class="benne">

                    <span class="benne-name">
                        ${flux.nom}
                    </span>

                    ${statutHTML(
                        flux.statut
                    )}

                </div>

            `;

        }
    );


    html += `

        <div class="mise-a-jour">

            🕐 Dernière mise à jour :
            ${site.derniereMiseAJour || "Aucune"}

        </div>


        <div class="info-live">

            🟢 Les informations sont
            mises à jour automatiquement
            par les agents.

        </div>


        <a
            class="itineraire"
            href="https://www.google.com/maps/dir/?api=1&destination=${site.lat},${site.lng}"
            target="_blank"
        >
            📍 Itinéraire
        </a>

        </div>

    `;


    container.innerHTML =
        html;


    container.scrollIntoView({
        behavior: "smooth"
    });

}



/* ==================================================
   MARQUEURS
================================================== */

dechetteries.forEach(
    function(site) {

        const marker =
            L.marker([
                site.lat,
                site.lng
            ]).addTo(map);


        marker.bindPopup(`

            <strong>
                ♻️ ${site.nom}
            </strong>

            <br><br>

            ${site.type}

            <br>

            📍 ${site.adresse}

        `);


        marker.on(
            "click",
            function() {

                afficherFiche(
                    site
                );

            }
        );

    }
);



/* ==================================================
   FIREBASE TEMPS REEL
================================================== */

dechetteries.forEach(
    function(site) {


        const reference =
            collection(
                db,
                "dechetteries",
                siteId(
                    site.nom
                ),
                "flux"
            );


        onSnapshot(
            reference,

            function(snapshot) {


                let derniereDate =
                    null;


                snapshot.forEach(
                    function(document) {

                        const data =
                            document.data();


                        const flux =
                            site.flux.find(
                                function(f) {

                                    return (
                                        f.id ===
                                        data.flux
                                    );

                                }
                            );


                        if (flux) {

                            flux.statut =
                                data.statut;

                        }


                        if (
                            data.miseAJour
                        ) {

                            derniereDate =
                                data.miseAJour;

                        }

                    }
                );


                if (derniereDate) {

                    site.derniereMiseAJour =
                        dateMiseAJour(
                            derniereDate
                        );

                }
                else {

                    site.derniereMiseAJour =
                        "Aucune";

                }


                if (
                    siteActuel &&
                    siteActuel.nom ===
                    site.nom
                ) {

                    afficherFiche(
                        site
                    );

                }

            },

            function(error) {

                console.error(
                    "Erreur Firebase :",
                    error
                );

            }

        );

    }
);



/* ==================================================
   RECHERCHE
================================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    function() {

        const recherche =
            this.value
            .toLowerCase()
            .trim();


        if (
            recherche === ""
        ) {

            return;

        }


        const site =
            dechetteries.find(
                function(site) {

                    return site.nom
                        .toLowerCase()
                        .includes(
                            recherche
                        );

                }
            );


        if (site) {

            map.setView(
                [
                    site.lat,
                    site.lng
                ],
                14
            );

            afficherFiche(
                site
            );

            return;

        }


        for (
            let i = 0;
            i < dechetteries.length;
            i++
        ) {

            const trouve =
                dechetteries[i]
                .flux
                .some(
                    function(flux) {

                        return flux.nom
                            .toLowerCase()
                            .includes(
                                recherche
                            );

                    }
                );


            if (trouve) {

                map.setView(
                    [
                        dechetteries[i].lat,
                        dechetteries[i].lng
                    ],
                    11
                );

                afficherFiche(
                    dechetteries[i]
                );

                break;

            }

        }

    }
);


</script>

</body>

</html>
