===================================================== */

function siteId(nom) {

    return nom
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-|-$/g,
            ""
        );

}

/* =====================================================
   DATE
===================================================== */

function afficherDate(timestamp) {


    if (!timestamp) {

        return "Mise à jour en cours";

    }


    try {

        const date =
            timestamp.toDate();


        return date.toLocaleString(

            "fr-FR",

            {

                day: "2-digit",

                month: "2-digit",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit"

            }

        );

    }

    catch(error) {

        return "Mise à jour récente";

    }

}
