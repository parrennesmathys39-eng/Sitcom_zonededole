<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sitcom Zone de Dole</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #17231b;
        }

        header {
            background: linear-gradient(135deg, #087f3d, #18a558);
            color: white;
            padding: 30px 20px 40px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .search {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-top: -25px;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search input:focus {
            border-color: #18a558;
        }

        h2 {
            margin-top: 30px;
        }

        #map {
            height: 430px;
            border-radius: 16px;
            margin-top: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .legend {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .green {
            background: #18a558;
        }

        .orange {
            background: #f0a500;
        }

        .red {
            background: #d62828;
        }

        .fiche {
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .fiche h3 {
            margin-top: 0;
            font-size: 23px;
        }

        .adresse {
            color: #666;
            margin-bottom: 20px;
        }

        .important {
            background: #e9f8ef;
            border-left: 4px solid #18a558;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .benne {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-top: 1px solid #eee;
            gap: 10px;
        }

        .benne-name {
            font-weight: 500;
        }

        .statut {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .disponible {
            background: #d9f7e5;
            color: #087f3d;
        }

        .presque {
            background: #fff0c2;
            color: #9a6500;
        }

        .pleine {
            background: #ffdede;
            color: #c62828;
        }

        .collecte {
            background: #edf0f2;
            color: #58636b;
        }

        .mise-a-jour {
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }

        .demo {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #fff8df;
            color: #795c00;
            font-size: 13px;
        }

        .itineraire {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 17px;
            border-radius: 10px;
            background: #087f3d;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .type-site {
            display: inline-block;
            padding: 6px 10px;
            background: #e7f5ec;
            color: #087f3d;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 25px;
            }

            #map {
                height: 350px;
            }

            .benne {
                font-size: 14px;
            }

            .statut {
                font-size: 12px;
            }
        }

    </style>
</head>


<body>


<header>

    <h1>♻️ Sitcom Zone de Dole</h1>

    <p>
        Vérifiez avant de vous déplacer.
    </p>

</header>


<div class="container">


    <!-- RECHERCHE -->

    <div class="search">

        <input
            type="text"
            id="search"
            placeholder="🔎 Rechercher une déchetterie ou un déchet..."
        >

    </div>


    <!-- CARTE -->

    <h2>
        🗺️ Déchetteries autour de Dole
    </h2>

    <div id="map"></div>


    <!-- LEGENDE -->

    <div class="legend">

        <span>
            <span class="dot green"></span>
            Disponible
        </span>

        <span>
            <span class="dot orange"></span>
            Presque pleine
        </span>

        <span>
            <span class="dot red"></span>
            Pleine
        </span>

    </div>


    <!-- FICHE DYNAMIQUE -->

    <div id="fiche-container"></div>


</div>


<footer>

    Sitcom Zone de Dole — Projet local ♻️

</footer>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =====================================================
   CARTE
===================================================== */

const map = L.map("map").setView(
    [47.09, 5.49],
    10
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
        "&copy; OpenStreetMap contributors"
    }
).addTo(map);



/* =====================================================
   TYPES DE FLUX SUIVIS
===================================================== */

/*
    Ce sont les flux que notre système pourra
    surveiller pour le remplissage.

    Les points comme papier, verre, piles, etc.
    pourront être ajoutés plus tard comme
    "points de collecte" plutôt que comme bennes.
*/


const fluxStandards = [

    {
        nom: "🗑️ Tout-venant",
        statut: "disponible"
    },

    {
        nom: "📦 Carton",
        statut: "disponible"
    },

    {
        nom: "🪨 Gravats",
        statut: "disponible"
    },

    {
        nom: "🔩 Ferraille",
        statut: "disponible"
    },

    {
        nom: "🪵 Bois A",
        statut: "presque"
    },

    {
        nom: "🪵 Bois B",
        statut: "disponible"
    },

    {
        nom: "🛋️ Mobilier",
        statut: "pleine"
    },

    {
        nom: "🧱 Plâtre",
        statut: "disponible"
    },

    {
        nom: "🧴 Plastiques durs",
        statut: "disponible"
    },

    {
        nom: "🛍️ Plastiques souples",
        statut: "disponible"
    }

];



/* =====================================================
   DECHETTERIES
===================================================== */

const dechetteries = [


    {
        nom: "Dole",

        lat: 47.092,

        lng: 5.486,

        adresse: "Rue Costes et Bellonte",

        type: "Déchèterie",

        professionnels: false,

        flux: fluxStandards

    },


    {
        nom: "Brevans",

        lat: 47.087,

        lng: 5.455,

        adresse: "22 allée du bois",

        type: "Déchèterie",

        professionnels: true,

        flux: fluxStandards

    },


    {
        nom: "Tavaux",

        lat: 47.044,

        lng: 5.405,

        adresse: "10 Rue du Luxembourg",

        type: "Déchèterie",

        professionnels: true,

        flux: fluxStandards

    },


    {
        nom: "Chaussin",

        lat: 46.966,

        lng: 5.408,

        adresse: "Zone industrielle",

        type: "Déchèterie",

        professionnels: true,

        flux: [

            {
                nom: "🗑️ Tout-venant",
                statut: "disponible"
            },

            {
                nom: "📦 Carton",
                statut: "disponible"
            },

            {
                nom: "🪨 Gravats",
                statut: "disponible"
            },

            {
                nom: "🔩 Ferraille",
                statut: "disponible"
            },

            {
                nom: "🪵 Bois A",
                statut: "pleine",
                important: true
            },

            {
                nom: "🪵 Bois B",
                statut: "presque"
            },

            {
                nom: "🛋️ Mobilier",
                statut: "pleine",
                important: true
            },

            {
                nom: "🧴 Plastiques durs",
                statut: "disponible"
            },

            {
                nom: "🛍️ Plastiques souples",
                statut: "disponible"
            },

            {
                nom: "🧱 Plâtre",
                statut: "disponible"
            }

        ]

    },


    {
        nom: "Dampierre",

        lat: 47.151,

        lng: 5.675,

        adresse: "6 Chemin du Tissage",

        type: "Déchèterie",

        professionnels: true,

        flux: fluxStandards

    },


    {
        nom: "Mont-sous-Vaudrey",

        lat: 46.999,

        lng: 5.584,

        adresse: "18 Route de Dole",

        type: "Déchèterie",

        professionnels: true,

        flux: fluxStandards

    },


    {
        nom: "Montmirey-le-Château",

        lat: 47.217,

        lng: 5.609,

        adresse: "Le Charme",

        type: "Déchèterie",

        professionnels: true,

        flux: fluxStandards

    },


    {
        nom: "Saligney",

        lat: 47.208,

        lng: 5.653,

        adresse: "Rue Principale",

        type: "Déchèterie",

        professionnels: true,

        flux: fluxStandards

    },


    {
        nom: "Villers-Farlay",

        lat: 46.984,

        lng: 5.718,

        adresse: "Rue du Val d'Amour",

        type: "Déchèterie",

        professionnels: true,

        flux: fluxStandards

    },


    {
        nom: "Saint-Aubin",

        lat: 46.944,

        lng: 5.314,

        adresse: "Rue de Fragnot",

        type: "Végéterie",

        professionnels: false,

        flux: [

            {
                nom: "🌿 Végétaux",
                statut: "disponible"
            }

        ]

    }

];



/* =====================================================
   COULEUR DU STATUT
===================================================== */

function statutHTML(statut) {

    if (statut === "disponible") {

        return `
            <span class="statut disponible">
                🟢 Disponible
            </span>
        `;

    }


    if (statut === "presque") {

        return `
            <span class="statut presque">
                🟠 Presque pleine
            </span>
        `;

    }


    if (statut === "pleine") {

        return `
            <span class="statut pleine">
                🔴 Pleine
            </span>
        `;

    }


    return `
        <span class="statut collecte">
            ℹ️ Point de collecte
        </span>
    `;

}



/* =====================================================
   AFFICHAGE D'UNE FICHE
===================================================== */

function afficherFiche(site) {


    const container =
        document.getElementById(
            "fiche-container"
        );


    let html = `

        <div class="fiche">

            <span class="type-site">
                ${site.type}
            </span>

            <h3>
                ♻️ ${site.nom}
            </h3>

            <div class="adresse">

                📍 ${site.adresse}

            </div>

    `;


    /*
       Information spéciale pour Chaussin
    */

    if (site.nom === "Chaussin") {

        html += `

            <div class="important">

                ⭐ <strong>Flux particulièrement surveillés</strong>

                <br><br>

                🪵 Bois
                <br>

                🛋️ Mobilier

                <br><br>

                L'état de ces flux pourra être mis à jour
                directement par l'agent de déchèterie.

            </div>

        `;

    }


    /*
       Dole
    */

    if (site.nom === "Dole") {

        html += `

            <div class="important">

                ℹ️ Cette déchèterie est actuellement
                indiquée comme <strong>interdite aux professionnels</strong>.

            </div>

        `;

    }


    html += `

        <h4>
            État des flux suivis
        </h4>

    `;


    /*
       Affichage des flux
    */

    site.flux.forEach(
        function(flux) {

            html += `

                <div class="benne">

                    <span class="benne-name">

                        ${flux.nom}

                    </span>

                    ${statutHTML(flux.statut)}

                </div>

            `;

        }
    );


    /*
       Dernière mise à jour
    */

    html += `

        <div class="mise-a-jour">

            🕐 Dernière mise à jour :
            aujourd'hui à 13h42

        </div>


        <div class="demo">

            ⚠️ <strong>Données de démonstration.</strong>

            <br><br>

            Les niveaux de remplissage ne sont pas encore
            connectés aux agents de déchèterie.

            Cette fonctionnalité sera ajoutée avec
            la base de données.

        </div>


        <a
            class="itineraire"

            href="https://www.google.com/maps/dir/?api=1&destination=${site.lat},${site.lng}"

            target="_blank"
        >

            📍 Itinéraire

        </a>


        </div>

    `;


    container.innerHTML = html;


    container.scrollIntoView({
        behavior: "smooth"
    });

}



/* =====================================================
   MARQUEURS DE LA CARTE
===================================================== */

dechetteries.forEach(
    function(site) {


        const marker =
            L.marker([
                site.lat,
                site.lng
            ]).addTo(map);


        marker.bindPopup(`

            <strong>
                ♻️ ${site.nom}
            </strong>

            <br><br>

            ${site.type}

            <br>

            📍 ${site.adresse}

        `);


        marker.on(
            "click",
            function() {

                afficherFiche(site);

            }
        );

    }
);



/* =====================================================
   RECHERCHE
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function() {


            const recherche =
                this.value
                    .toLowerCase()
                    .trim();


            if (recherche === "") {

                return;

            }


            /*
               Recherche d'une déchetterie
            */

            const site =
                dechetteries.find(
                    function(site) {

                        return site.nom
                            .toLowerCase()
                            .includes(recherche);

                    }
                );


            if (site) {

                map.setView(
                    [
                        site.lat,
                        site.lng
                    ],
                    14
                );

                afficherFiche(site);

                return;

            }


            /*
               Recherche d'un type de déchet
            */

            for (
                let i = 0;
                i < dechetteries.length;
                i++
            ) {


                const trouve =
                    dechetteries[i].flux.some(
                        function(flux) {

                            return flux.nom
                                .toLowerCase()
                                .includes(recherche);

                        }
                    );


                if (trouve) {

                    map.setView(
                        [
                            dechetteries[i].lat,
                            dechetteries[i].lng
                        ],
                        11
                    );

                    afficherFiche(
                        dechetteries[i]
                    );

                    break;

                }

            }

        }
    );


</script>

</body>
</html>
