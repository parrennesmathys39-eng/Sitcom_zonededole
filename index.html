/* =====================================================
   IDENTIFIANT
===================================================== */

function siteId(nom) {

    return nom
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");

}


/* =====================================================
   STATUT
===================================================== */

function statutHTML(statut) {

    if (statut === "disponible") {

        return `
            <span class="statut disponible">
                🟢 Disponible
            </span>
        `;

    }

    if (statut === "presque") {

        return `
            <span class="statut presque">
                🟠 Presque pleine
            </span>
        `;

    }

    if (statut === "pleine") {

        return `
            <span class="statut pleine">
                🔴 Pleine
            </span>
        `;

    }

    return `
        <span class="statut inconnu">
            ⚪ Non renseigné
        </span>
    `;

}


/* =====================================================
   DATE
===================================================== */

function afficherDate(timestamp) {

    if (!timestamp) {
        return "Mise à jour en cours";
    }

    try {

        return timestamp
            .toDate()
            .toLocaleString(
                "fr-FR",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }

    catch(error) {

        return "Mise à jour récente";

    }

}
