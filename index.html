><style>

* {

body {
    margin: 0;
    font-family: Arial, sans-serif;

}

header {
    background: linear-gradient(135deg, #087f3d, #18a558);

}

}

}

.container {

.bouton-agent {

#map {

}

.red {

}

    border-radius: 18px;

}

.fiche h3 {
    margin-top: 5px;
    margin-bottom: 8px;

}

.adresse {

}

.type-site {

    margin-bottom: 8px;
}

.important {
    background: #e9f8ef;
    border-left: 4px solid #18a558;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
}

.benne {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-top: 1px solid #eee;
    gap: 12px;
}

.benne-name {
    font-weight: 600;
    font-size: 16px;
}

.statut {
    padding: 9px 13px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.disponible {
    background: #d9f7e5;
    color: #087f3d;
}

.presque {
    background: #fff0c2;
    color: #9a6500;
}

.pleine {
    background: #ffdede;
    color: #c62828;
}

.inconnu {
    background: #eeeeee;
    color: #555;
}

.mise-a-jour {
    margin-top: 20px;
    padding: 12px;
    background: #f4f7f5;
    border-radius: 10px;
    font-size: 13px;
    color: #666;
}

.itineraire {
    display: inline-block;
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 10px;
    background: #087f3d;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.firebase-status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #eef2f0;
    color: #56635b;
    font-size: 13px;
}

.firebase-status.erreur {
    background: #ffdede;
    color: #c62828;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    font-size: 13px;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 25px;
    }

    #map {
        height: 350px;
    }

    .benne {
        align-items: flex-start;
    }

    .benne-name {
        font-size: 15px;
    }

    .statut {
        font-size: 12px;
        padding: 8px 10px;
    }

    .fiche {
        padding: 18px;
    }

}

</style></head><body><header><h1>♻️ SICTOM Zone de Dole</h1><p>
Vérifiez l'état des déchèteries avant de vous déplacer.
</p></header><div class="container"><a
href="./agent.html"
class="bouton-agent"

«»

👷 Espace agent
</a>

<div class="search"><input
type="text"
id="search"
placeholder="🔎 Rechercher une déchèterie ou un déchet..."

«»

</div><h2>
🗺️ Déchèteries
</h2><div id="map"></div><div class="legend"><span>
<span class="dot green"></span>
Disponible
</span><span>
<span class="dot orange"></span>
Presque pleine
</span><span>
<span class="dot red"></span>
Pleine
</span></div><div
id="firebaseStatus"
class="firebase-status"
>
🔄 Connexion aux informations en temps réel...
</div><div id="fiche-container"></div></div><footer>SICTOM Zone de Dole — Informations sur les déchèteries ♻️

</footer><script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script><script
src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js">
</script><script
src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js">
</script><script>

const firebaseConfig = {

apiKey:
"AIzaSyC85gp3FkHaVZPm7HdFP8jPlvATT-QH9_s",

authDomain:
"sictom-zone-de-dole-17296.firebaseapp.com",

projectId:
"sictom-zone-de-dole-17296",

storageBucket:
"sictom-zone-de-dole-17296.firebasestorage.app",

messagingSenderId:
"378183859073",

appId:
"1:378183859073:web:3b347f84a072fb0cb54680"

};

firebase.initializeApp(firebaseConfig);

const db =
firebase.firestore();

const map =
L.map("map").setView(
[47.09, 5.49],
10
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:
"&copy; OpenStreetMap contributors"
}
).addTo(map);

const fluxNoms = {

"tout-venant":
"🗑️ Non recyclable / Tout-venant",

"carton":
"📦 Carton",

"gravats":
"🪨 Gravats",

"ferraille":
"🔩 Ferraille",

"bois-a":
"🪵 Bois A",

"bois-b":
"🪵 Bois B",

"mobilier":
"🛋️ Mobilier",

"platre":
"🧱 Plâtre",

"plastique-dur":
"🧴 Plastique dur"

};

const dechetteries = [

{
nom: "Dole",
lat: 47.092,
lng: 5.486,
adresse: "Rue Costes et Bellonte",
type: "Déchèterie",
professionnels: false
},

{
nom: "Brevans",
lat: 47.087,
lng: 5.455,
adresse: "22 allée du bois",
type: "Déchèterie",
professionnels: true
},

{
nom: "Tavaux",
lat: 47.044,
lng: 5.405,
adresse: "10 Rue du Luxembourg",
type: "Déchèterie",
professionnels: true
},

{
nom: "Chaussin",
lat: 46.966,
lng: 5.408,
adresse: "Zone industrielle",
type: "Déchèterie",
professionnels: true
},

{
nom: "Dampierre",
lat: 47.151,
lng: 5.675,
adresse: "6 Chemin du Tissage",
type: "Déchèterie",
professionnels: true
},

{
nom: "Mont-sous-Vaudrey",
lat: 46.999,
lng: 5.584,
adresse: "18 Route de Dole",
type: "Déchèterie",
professionnels: true
},

{
nom: "Montmirey-le-Château",
lat: 47.217,
lng: 5.609,
adresse: "Le Charme",
type: "Déchèterie",
professionnels: true
},

{
nom: "Saligney",
lat: 47.208,
lng: 5.653,
adresse: "Rue Principale",
type: "Déchèterie",
professionnels: true
},

{
nom: "Villers-Farlay",
lat: 46.984,
lng: 5.718,
adresse: "Rue du Val d'Amour",
type: "Déchèterie",
professionnels: true
},

{
nom: "Saint-Aubin",
lat: 46.944,
lng: 5.314,
adresse: "Rue de Fragnot",
type: "Végéterie",
professionnels: false
}

];

function siteId(nom) {

return nom
.toLowerCase()
.normalize("NFD")
.replace(
/[\u0300-\u036f]/g,
""
)
.replace(
/[^a-z0-9]+/g,
"-"
)
.replace(
/^-|-$/g,
""
);

}

function statutHTML(statut) {

if (
statut === "disponible"
) {

return `
<span class="statut disponible">
🟢 Disponible
</span>
`;

}

if (
statut === "presque"
) {

return `
<span class="statut presque">
🟠 Presque pleine
</span>
`;

}

if (
statut === "pleine"
) {

return `
<span class="statut pleine">
🔴 Pleine
</span>
`;

}

return `
<span class="statut inconnu">
⚪ Non renseigné
</span>
`;

}

function afficherDate(timestamp) {

if (!timestamp) {

return "Mise à jour en cours";

}

try {

const date =
timestamp.toDate();

return date.toLocaleString(
"fr-FR",
{

day: "2-digit",
month: "2-digit",
year: "numeric",
hour: "2-digit",
minute: "2-digit"

}
);

}

catch(error) {

return "Mise à jour récente";

}

}

async function afficherFiche(site) {

const container =
document.getElementById(
"fiche-container"
);

container.innerHTML = `

<div class="fiche">

<span class="type-site">
${site.type}
</span>

<h3>
♻️ ${site.nom}
</h3>

<div class="adresse">
📍 ${site.adresse}
</div>

${
site.nom === "Chaussin"
?
`
<div class="important">

⭐ <strong>
À surveiller particulièrement
</strong>

<br><br>

🪵 Bois A et Bois B
<br>
🛋️ Mobilier

</div>
`
:
""
}

<h4>
État actuel des flux
</h4>

<div id="flux-${siteId(site.nom)}">

<div class="firebase-status">
🔄 Chargement des informations...
</div>

</div>

<div class="mise-a-jour">

🕐 Les statuts sont mis à jour
directement par les agents.

</div>

<a
class="itineraire"
href="https://www.google.com/maps/dir/?api=1&destination=${site.lat},${site.lng}"
target="_blank"
>
📍 Itinéraire
</a>

</div>
`;

container.scrollIntoView({
behavior: "smooth"
});

chargerFlux(site);

}

function chargerFlux(site) {

const id =
siteId(site.nom);

const container =
document.getElementById(
"flux-" + id
);

if (!container) {

return;

}

db.collection("dechetteries")
.doc(id)
.collection("flux")
.onSnapshot(

function(snapshot) {

const donnees = {};

snapshot.forEach(
function(doc) {

donnees[
doc.id
] = doc.data();

});

let html = "";

let fluxAfficher = [

"tout-venant",
"carton",
"gravats",
"ferraille",
"bois-a",
"bois-b",
"mobilier",
"platre",
"plastique-dur"

];

if (
site.nom === "Saint-Aubin"
) {

fluxAfficher = [
"vegetaux"
];

}

fluxAfficher.forEach(
function(fluxId) {

const data =
donnees[fluxId];

let nom =
fluxNoms[fluxId];

if (
fluxId === "vegetaux"
) {

nom = "🌿 Végétaux";

}

let statut =
data
? data.statut
: null;

html += `

<div class="benne">

<span class="benne-name">
${nom}
</span>

${statutHTML(statut)}

</div>

`;

});

let dernierTimestamp =
null;

snapshot.forEach(
function(doc) {

const data =
doc.data();

if (
data.miseAJour
) {

if (
!dernierTimestamp ||
data.miseAJour.toMillis()
>
dernierTimestamp.toMillis()
) {

dernierTimestamp =
data.miseAJour;

}

}

});

if (
dernierTimestamp
) {

html += `

<div class="mise-a-jour">

🕐 Dernière mise à jour :
<strong>
${afficherDate(dernierTimestamp)}
</strong>

</div>

`;

}
else {

html += `

<div class="mise-a-jour">

🕐 Aucun statut n'a encore été renseigné
par un agent.

</div>

`;

}

container.innerHTML =
html;

},

function(error) {

console.error(
error
);

container.innerHTML = `

<div class="firebase-status erreur">

❌ Impossible de charger
les informations actuellement.

</div>

`;

});

}

dechetteries.forEach(
function(site) {

const marker =
L.marker([
site.lat,
site.lng
]).addTo(map);

marker.bindPopup(`

<strong>
♻️ ${site.nom}
</strong>

<br><br>

${site.type}

<br>

📍 ${site.adresse}

<br><br>

Cliquez pour voir
les statuts.

`);

marker.on(
"click",
function() {

afficherFiche(site);

}
);

});

document
.getElementById("search")
.addEventListener(
"input",
function() {

const recherche =
this.value
.toLowerCase()
.trim();

if (
recherche === ""
) {

return;

}

const site =
dechetteries.find(
function(site) {

return site.nom
.toLowerCase()
.includes(recherche);

});

if (site) {

map.setView(
[
site.lat,
site.lng
],
14
);

afficherFiche(site);

return;

}

for (
let i = 0;
i < dechetteries.length;
i++
) {

const fluxTrouve =
Object.values(
fluxNoms
).some(
function(nom) {

return nom
.toLowerCase()
.includes(recherche);

}
);

if (fluxTrouve) {

map.setView(
[
dechetteries[i].lat,
dechetteries[i].lng
],
11
);

afficherFiche(
dechetteries[i]
);

break;

}

}

});

const firebaseStatus =
document.getElementById(
"firebaseStatus"
);

firebaseStatus.innerHTML =
"🟢 Informations connectées en temps réel";

afficherFiche(
dechetteries[0]
);

</script></body>
</html>
