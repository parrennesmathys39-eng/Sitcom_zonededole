<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sitcom Zone de Dole</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #17231b;
        }

        header {
            background: linear-gradient(135deg, #087f3d, #18a558);
            color: white;
            padding: 30px 20px 40px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .search {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-top: -25px;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search input:focus {
            border-color: #18a558;
        }

        h2 {
            margin-top: 30px;
        }

        #map {
            height: 430px;
            border-radius: 16px;
            margin-top: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .legend {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .green {
            background: #18a558;
        }

        .orange {
            background: #f0a500;
        }

        .red {
            background: #d62828;
        }

        .fiche {
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .fiche h3 {
            margin-top: 0;
            font-size: 23px;
        }

        .adresse {
            color: #666;
            margin-bottom: 20px;
        }

        .benne {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-top: 1px solid #eee;
            gap: 10px;
        }

        .statut {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .disponible {
            background: #d9f7e5;
            color: #087f3d;
        }

        .presque {
            background: #fff0c2;
            color: #9a6500;
        }

        .pleine {
            background: #ffdede;
            color: #c62828;
        }

        .mise-a-jour {
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }

        .demo {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #fff8df;
            color: #795c00;
            font-size: 13px;
        }

        .itineraire {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 17px;
            border-radius: 10px;
            background: #087f3d;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 13px;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
        }

        .popup-status {
            margin-top: 8px;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 25px;
            }

            #map {
                height: 350px;
            }

            .benne {
                font-size: 14px;
            }

            .statut {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>♻️ Sitcom Zone de Dole</h1>
    <p>Vérifiez avant de vous déplacer.</p>
</header>

<div class="container">

    <div class="search">
        <input
            type="text"
            id="search"
            placeholder="🔎 Rechercher une déchetterie..."
        >
    </div>

    <h2>🗺️ Déchetteries autour de Dole</h2>

    <div id="map"></div>

    <div class="legend">

        <span>
            <span class="dot green"></span>
            Disponible
        </span>

        <span>
            <span class="dot orange"></span>
            Presque pleine
        </span>

        <span>
            <span class="dot red"></span>
            Pleine
        </span>

    </div>

    <div id="fiche-container"></div>

</div>

<footer>
    Sitcom Zone de Dole — Projet local ♻️
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    /* =========================
       CARTE
    ========================= */

    const map = L.map("map").setView([47.09, 5.49], 10);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    /* =========================
       DONNÉES DES DÉCHETTERIES
       ========================= */

    const dechetteries = [

        {
            nom: "Dole",
            lat: 47.092,
            lng: 5.486,
            adresse: "Dole, Jura"
        },

        {
            nom: "Brevans",
            lat: 47.087,
            lng: 5.455,
            adresse: "Brevans, Jura"
        },

        {
            nom: "Tavaux",
            lat: 47.044,
            lng: 5.405,
            adresse: "Tavaux, Jura"
        },

        {
            nom: "Chaussin",
            lat: 46.966,
            lng: 5.408,
            adresse: "Chaussin, Jura"
        },

        {
            nom: "Dampierre",
            lat: 47.151,
            lng: 5.675,
            adresse: "Dampierre, Jura"
        },

        {
            nom: "Mont-sous-Vaudrey",
            lat: 46.999,
            lng: 5.584,
            adresse: "Mont-sous-Vaudrey, Jura"
        },

        {
            nom: "Montmirey-le-Château",
            lat: 47.217,
            lng: 5.609,
            adresse: "Montmirey-le-Château, Jura"
        },

        {
            nom: "Saligney",
            lat: 47.208,
            lng: 5.653,
            adresse: "Saligney, Jura"
        },

        {
            nom: "Villers-Farlay",
            lat: 46.984,
            lng: 5.718,
            adresse: "Villers-Farlay, Jura"
        },

        {
            nom: "Saint-Aubin",
            lat: 46.944,
            lng: 5.314,
            adresse: "Saint-Aubin, Jura — Végéterie"
        }

    ];


    /* =========================
       ÉTAT DES BENNES
    ========================= */

    const bennes = [

        {
            nom: "🪵 Bois",
            statut: "disponible",
            texte: "Disponible"
        },

        {
            nom: "📦 Cartons",
            statut: "disponible",
            texte: "Disponible"
        },

        {
            nom: "🌿 Déchets verts",
            statut: "presque",
            texte: "Presque pleine"
        },

        {
            nom: "🛋️ Encombrants",
            statut: "pleine",
            texte: "Pleine"
        },

        {
            nom: "🪨 Gravats",
            statut: "disponible",
            texte: "Disponible"
        },

        {
            nom: "🔩 Métaux",
            statut: "disponible",
            texte: "Disponible"
        }

    ];


    /* =========================
       CRÉATION DES MARQUEURS
    ========================= */

    dechetteries.forEach((dechetterie) => {

        const marker = L.marker([
            dechetterie.lat,
            dechetterie.lng
        ]).addTo(map);


        marker.bindPopup(`
            <div class="popup-title">
                ♻️ Déchèterie de ${dechetterie.nom}
            </div>

            <div class="popup-status">
                📍 ${dechetterie.adresse}
            </div>
        `);


        marker.on("click", function() {

            afficherFiche(dechetterie);

        });

    });


    /* =========================
       AFFICHER UNE FICHE
    ========================= */

    function afficherFiche(dechetterie) {

        const container =
            document.getElementById("fiche-container");


        let html = `

            <div class="fiche">

                <h3>
                    ♻️ Déchèterie de ${dechetterie.nom}
                </h3>

                <div class="adresse">
                    📍 ${dechetterie.adresse}
                </div>

                <h4>
                    État des bennes
                </h4>
        `;


        bennes.forEach((benne) => {

            html += `

                <div class="benne">

                    <span>
                        ${benne.nom}
                    </span>

                    <span class="statut ${benne.statut}">
                        ${benne.statut === "disponible" ? "🟢" : ""}
                        ${benne.statut === "presque" ? "🟠" : ""}
                        ${benne.statut === "pleine" ? "🔴" : ""}
                        ${benne.texte}
                    </span>

                </div>

            `;

        });


        html += `

                <div class="mise-a-jour">

                    🕐 Dernière mise à jour :
                    aujourd'hui à 13h42

                </div>

                <div class="demo">

                    ⚠️ Données de démonstration.
                    Les états des bennes ne sont pas encore
                    connectés aux données réelles.

                </div>

                <a
                    class="itineraire"
                    href="https://www.google.com/maps/dir/?api=1&destination=${dechetterie.lat},${dechetterie.lng}"
                    target="_blank"
                >
                    📍 Itinéraire
                </a>

            </div>

        `;


        container.innerHTML = html;


        container.scrollIntoView({
            behavior: "smooth"
        });

    }


    /* =========================
       RECHERCHE
    ========================= */

    document
        .getElementById("search")
        .addEventListener("input", function() {

            const recherche =
                this.value.toLowerCase().trim();


            const resultat =
                dechetteries.find((dechetterie) =>
                    dechetterie.nom
                        .toLowerCase()
                        .includes(recherche)
                );


            if (resultat) {

                map.setView(
                    [
                        resultat.lat,
                        resultat.lng
                    ],
                    14
                );

            }

        });

</script>

</body>
</html>
