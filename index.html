<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sitcom Zone de Dole</title>

    <!-- Leaflet : bibliothèque de carte -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #17231b;
        }

        header {
            background: linear-gradient(135deg, #087f3d, #18a558);
            color: white;
            padding: 28px 20px 35px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .search {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-top: -25px;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .search input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        h2 {
            margin-top: 30px;
        }

        #map {
            height: 450px;
            border-radius: 16px;
            margin-top: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .legend {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 14px;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .green {
            background: #18a558;
        }

        .orange {
            background: #f0a500;
        }

        .red {
            background: #d62828;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>♻️ Sitcom Zone de Dole</h1>
    <p>Vérifiez avant de vous déplacer.</p>
</header>

<div class="container">

    <div class="search">
        <input
            type="text"
            id="search"
            placeholder="🔎 Rechercher une déchetterie..."
        >
    </div>

    <h2>🗺️ Déchetteries autour de Dole</h2>

    <div id="map"></div>

    <div class="legend">
        <span>
            <span class="dot green"></span>
            Disponible
        </span>

        <span>
            <span class="dot orange"></span>
            Presque pleine
        </span>

        <span>
            <span class="dot red"></span>
            Pleine
        </span>
    </div>

</div>

<footer>
    Sitcom Zone de Dole — Projet local ♻️
</footer>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // Création de la carte
    const map = L.map('map').setView([47.09, 5.49], 10);

    // Fond de carte OpenStreetMap
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    // Déchetteries
    // Les coordonnées sont approximatives pour le prototype.
    const dechetteries = [

        {
            nom: "Dole",
            lat: 47.092,
            lng: 5.486,
            adresse: "Rue Costes et Bellonte",
            statut: "green"
        },

        {
            nom: "Brevans",
            lat: 47.087,
            lng: 5.455,
            adresse: "22 allée du bois",
            statut: "green"
        },

        {
            nom: "Tavaux",
            lat: 47.044,
            lng: 5.405,
            adresse: "10 Rue du Luxembourg",
            statut: "orange"
        },

        {
            nom: "Chaussin",
            lat: 46.966,
            lng: 5.408,
            adresse: "Zone Industrielle",
            statut: "green"
        },

        {
            nom: "Dampierre",
            lat: 47.151,
            lng: 5.675,
            adresse: "6 Chemin du Tissage",
            statut: "red"
        },

        {
            nom: "Mont-sous-Vaudrey",
            lat: 46.999,
            lng: 5.584,
            adresse: "18 Route de Dole",
            statut: "green"
        },

        {
            nom: "Montmirey-le-Château",
            lat: 47.217,
            lng: 5.609,
            adresse: "Le Charme",
            statut: "green"
        },

        {
            nom: "Saligney",
            lat: 47.208,
            lng: 5.653,
            adresse: "Rue Principale",
            statut: "orange"
        },

        {
            nom: "Villers-Farlay",
            lat: 46.984,
            lng: 5.718,
            adresse: "Rue du Val d'Amour",
            statut: "green"
        },

        {
            nom: "Saint-Aubin",
            lat: 46.944,
            lng: 5.314,
            adresse: "Rue de Fragnot — Végéterie",
            statut: "green"
        }

    ];


    // Couleur du marqueur
    function couleur(statut) {

        if (statut === "green") {
            return "🟢";
        }

        if (statut === "orange") {
            return "🟠";
        }

        return "🔴";
    }


    // Ajouter les déchetteries sur la carte
    dechetteries.forEach(dechetterie => {

        const marker = L.marker([
            dechetterie.lat,
            dechetterie.lng
        ]).addTo(map);

        marker.bindPopup(`
            <strong>♻️ Déchèterie de ${dechetterie.nom}</strong>
            <br><br>
            📍 ${dechetterie.adresse}
            <br><br>
            ${couleur(dechetterie.statut)}
            État général
            <br><br>
            <button onclick="alert('La fiche détaillée arrivera bientôt !')">
                Voir les bennes
            </button>
        `);

    });


    // Recherche
    document
        .getElementById("search")
        .addEventListener("input", function() {

            const recherche = this.value.toLowerCase();

            dechetteries.forEach(dechetterie => {

                if (
                    dechetterie.nom
                        .toLowerCase()
                        .includes(recherche)
                ) {
                    map.setView(
                        [dechetterie.lat, dechetterie.lng],
                        14
                    );
                }

            });

        });

</script>

</body>
</html>
