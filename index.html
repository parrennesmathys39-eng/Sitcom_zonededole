   HEADER
===================================================== */

}

header h1 {

}

header p {

    font-size: 13.5px;
    color: #B8C7BE;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
    max-width: 1050px;
    margin: auto;

/* =====================================================
   ESPACE AGENT
===================================================== */

.bouton-agent {

    box-shadow: var(--ombre);
    transition: border-color 0.15s ease, background 0.15s ease;
}

.bouton-agent:hover {

}


/* =====================================================
   RECHERCHE
===================================================== */

.search {

}

.search input {
    width: 100%;

    border-radius: var(--rayon);

}

.green {

.orange {

/* =====================================================

===================================================== */

.fiche {

/* =====================================================

const dechetteries = [

/* =====================================================
   IDENTIFIANT FIRESTORE
===================================================== */

function siteId(nom) {

    return nom
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-|-$/g,
            ""
        );

}



/* =====================================================
   STATUT
===================================================== */

function statutHTML(statut) {


    if (
        statut === "disponible"
    ) {

        return `

        <span class="statut disponible">

            🟢 Disponible

        </span>

        `;

    }


    if (
        statut === "presque"
    ) {

        return `

        <span class="statut presque">

            🟠 Presque pleine

        </span>

        `;

    }


    if (
        statut === "pleine"
    ) {

        return `

        <span class="statut pleine">

            🔴 Pleine

        </span>

        `;

    }


    return `

    <span class="statut inconnu">

        ⚪ Non renseigné

    </span>

    `;

}



/* =====================================================
   DATE
===================================================== */

function afficherDate(timestamp) {


    if (!timestamp) {

        return "Mise à jour en cours";

    }


    try {

        const date =
            timestamp.toDate();


        return date.toLocaleString(

            "fr-FR",

            {

                day: "2-digit",

                month: "2-digit",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit"

            }

        );

    }

    catch(error) {

        return "Mise à jour récente";

    }

}



/* =====================================================
   FICHE
===================================================== */

async function afficherFiche(site) {


    const container =
        document.getElementById(
            "fiche-container"
        );


    container.innerHTML = `

    <div class="fiche">

        <span class="type-site">

            ${site.type}

        </span>

        </h3>

        </div>


        ${

            `

                ⭐

                <strong>
                    À surveiller particulièrement
                </strong>

                <br><br>

                🪵 Bois A et Bois B

                <br>

                🛋️ Mobilier

            </div>

            `

            :

            ""

        }


        <h4>

            État actuel des flux

        </h4>


        <div id="flux-${siteId(site.nom)}">

            <div class="firebase-status">

                🔄 Chargement des informations...

            </div>

        </div>


        <div class="mise-a-jour">

            🕐 Les statuts sont mis à jour
            directement par les agents.

        </div>


        <a
            class="itineraire"
            href="https://www.google.com/maps/dir/?api=1&destination=${site.lat},${site.lng}"
            target="_blank"
            rel="noopener noreferrer"
        >

            📍 Itinéraire

        </a>

    </div>

    `;


    container.scrollIntoView({

        behavior: "smooth",

        block: "start"

    });


    chargerFlux(site);

}



/* =====================================================
   CHARGER FLUX
===================================================== */

function chargerFlux(site) {


    const id =
        siteId(site.nom);


    const container =
        document.getElementById(
            "flux-" + id
        );


    if (!container) {

        return;

    }


    db.collection("dechetteries")
        .doc(id)
        .collection("flux")
        .onSnapshot(

            function(snapshot) {


                const donnees = {};


                snapshot.forEach(

                    function(doc) {

                        donnees[
                            doc.id
                        ] = doc.data();

                    }

                );


                let html = "";


                /* =========================
                   FLUX
                ========================= */

                let fluxAfficher = [

                    "tout-venant",
                    "carton",
                    "gravats",
                    "ferraille",
                    "bois-a",
                    "bois-b",
                    "mobilier",
                    "platre",
                    "plastique-dur"

                ];


                if (
                    site.nom === "Saint-Aubin"
                ) {

                    fluxAfficher = [

                        "vegetaux"

                    ];

                }


                /* =========================
                   AFFICHAGE
                ========================= */

                fluxAfficher.forEach(

                    function(fluxId) {


                        const data =
                            donnees[fluxId];


                        let nom =
                            fluxNoms[fluxId];


                        if (
                            fluxId === "vegetaux"
                        ) {

                            nom =
                                "🌿 Végétaux";

                        }


                        const statut =
                            data
                            ? data.statut
                            : null;


                        html += `

                        <div class="benne">

                            <span class="benne-name">

                                ${nom}

                            </span>

                            ${statutHTML(statut)}

                        </div>

                        `;

                    }

                );


                /* =========================
                   DERNIERE DATE
                ========================= */

                let dernierTimestamp =
                    null;


                snapshot.forEach(

                    function(doc) {

                        const data =
                            doc.data();


                        if (
                            data.miseAJour
                        ) {

                            if (
                                !dernierTimestamp ||

                                data.miseAJour.toMillis()
                                >
                                dernierTimestamp.toMillis()

                            ) {

                                dernierTimestamp =
                                    data.miseAJour;

                            }

                        }

                    }

                );


                if (
                    dernierTimestamp
                ) {

                    html += `

                    <div class="mise-a-jour">

                        🕐 Dernière mise à jour :

                        <strong>

                            ${afficherDate(
                                dernierTimestamp
                            )}

                        </strong>

                    </div>

                    `;

                }

                else {

                    html += `

                    <div class="mise-a-jour">

                        🕐 Aucun statut n'a encore été
                        renseigné par un agent.

                    </div>

                    `;

                }


                container.innerHTML =
                    html;

            },


            function(error) {


                console.error(error);


                container.innerHTML = `

                <div class="firebase-status erreur">

                    ❌ Impossible de charger
                    les informations actuellement.

                </div>

                `;

            }

        );

}

dechetteries.forEach(

                site.lat,
                site.lng

            ]).addTo(map);


        marker.bindPopup(`

            ${site.type}

            <br>

            <span
                style="
                    color:#1B4B3A;
                    font-weight:bold;
                "
            >
                Cliquez pour voir les statuts
            </span>

        `);


        marker.on(

            "click",

            function() {

                afficherFiche(site);

            }

        );

    }

);



/* =====================================================
   RECHERCHE
===================================================== */

document
    .getElementById("search")
    .addEventListener(

        "input",

        function() {


            const recherche =
                this.value
                    .toLowerCase()
                    .trim();


            if (
                recherche === ""
            ) {

                return;

            }


            /* =========================
               RECHERCHE DECHETERIE
            ========================= */

            const site =
                dechetteries.find(

                    function(site) {

                        return site.nom
                            .toLowerCase()
                            .includes(
                                recherche
                            );

                    }

                );


            if (site) {


                map.setView(

                    [
                        site.lat,
                        site.lng
                    ],

                    14

                );


                afficherFiche(site);


                return;

            }


            /* =========================
               RECHERCHE FLUX
            ========================= */

            for (

                let i = 0;

                i < dechetteries.length;

                i++

            ) {


                const fluxTrouve =

                    Object.values(
                        fluxNoms
                    ).some(

                        function(nom) {

                            return nom
                                .toLowerCase()
                                .includes(
                                    recherche
                                );

                        }

                    );


                if (fluxTrouve) {


                    map.setView(

                        [
                            dechetteries[i].lat,
                            dechetteries[i].lng
                        ],

                        11

                    );


                    afficherFiche(
                        dechetteries[i]
                    );


                    break;

                }

            }

        }

    );
