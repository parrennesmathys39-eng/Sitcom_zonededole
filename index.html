<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon premier site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 60px 20px;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            background: white;
            color: #111;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Bienvenue sur mon site 🚀</h1>
        <p>Mon premier site créé entièrement depuis mon téléphone.</p>
        <a class="button" href="https://github.com/">Mon GitHub</a>
    </header>

</body>
</html>
